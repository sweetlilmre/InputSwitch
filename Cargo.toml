[package]
name = "inputswitch"
version = "0.2.0"
edition = "2021"
description = "Tray utility that switches monitor inputs over DDC/CI with per-setup hotkeys."
publish = false

# No dependencies: the Windows API is called directly (see src/ffi/).
[dependencies]

[[bin]]
name = "InputSwitch"
path = "src/main.rs"

# Smallest binary: optimise for size, link-time optimisation, no unwinding, no symbols.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
