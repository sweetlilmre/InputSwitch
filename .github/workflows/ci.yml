# Builds InputSwitch and runs the smoke tests.
#
# Runs on every pull request to main (make "Build and smoke test" a required status check so a PR
# can't merge until it passes; see docs/TECHNICAL.md), on pushes to main, on demand, and from the
# release workflow before anything is published.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: Build and smoke test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build InputSwitch.csproj -c Release -p:ContinuousIntegrationBuild=true

      - name: Logic smoke tests
        run: dotnet run -c Release --project tests/InputSwitch.SmokeTests

      - name: Build screenshot tool
        run: dotnet build tools/WindowCapture -c Release

      - name: Launch smoke test
        shell: pwsh
        run: >
          ./tests/launch-smoke.ps1
          -Exe bin/Release/net10.0-windows/InputSwitch.exe
          -OutDir smoke-out
          -Capture tools/WindowCapture/bin/Release/net10.0-windows10.0.22621.0/WindowCapture.exe

      - name: Check a release build publishes
        run: >
          dotnet publish InputSwitch.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish-check

      - name: Upload smoke results (report and screenshot)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-results
          path: smoke-out
          if-no-files-found: ignore
          retention-days: 14
