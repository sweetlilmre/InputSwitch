# Builds InputSwitch, runs the tests, and on main packages the release files.
#
# One job, so each binary is built once and the files that are tested are the files that ship:
#   1. clippy (warnings are errors) and the unit tests;
#   2. build the x64 release exe and launch-test it;
#   3. on pushes to main only: build the Arm64 exe, zip both with checksums, and keep them as
#      the "release-files" artifact. Tagging that commit vX.Y.Z publishes exactly those files;
#      the release workflow doesn't rebuild anything.
#
# The Rust version comes from rust-toolchain.toml (rustup on the runner installs it).
# Make "Build and test" a required status check so a PR can't merge until it passes
# (see docs/TECHNICAL.md).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Package release files only for pushes to main.
      PACKAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup show active-toolchain
          if ($env:PACKAGE -eq 'true') { rustup target add aarch64-pc-windows-msvc }

      - name: Clippy
        run: cargo clippy --release --locked -- -D warnings

      - name: Unit tests
        run: cargo test --release --locked

      - name: Build
        shell: pwsh
        run: |
          # Arm64 is only needed for release files, so it's skipped on pull requests.
          $targets = if ($env:PACKAGE -eq 'true') { 'x86_64-pc-windows-msvc', 'aarch64-pc-windows-msvc' } else { 'x86_64-pc-windows-msvc' }
          foreach ($target in $targets) {
            cargo build --release --locked --target $target
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Launch smoke test (x64)
        shell: pwsh
        run: ./tests/launch-smoke.ps1 -Exe target/x86_64-pc-windows-msvc/release/InputSwitch.exe

      - name: Zip release files
        if: env.PACKAGE == 'true'
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($arch in @{ 'x64' = 'x86_64-pc-windows-msvc'; 'arm64' = 'aarch64-pc-windows-msvc' }.GetEnumerator()) {
            Compress-Archive -Path "target/$($arch.Value)/release/InputSwitch.exe" -DestinationPath "dist/InputSwitch-$version-win-$($arch.Key).zip"
          }
          Get-ChildItem dist/*.zip | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content dist/SHA256SUMS.txt
          Get-ChildItem dist | Format-Table Name, Length

      - name: Keep the release files
        if: env.PACKAGE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: dist
          if-no-files-found: error
          retention-days: 90
