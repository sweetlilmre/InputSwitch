# Builds InputSwitch, runs the smoke tests, and on main packages the release files.
#
# One job, so each binary is built once and the files that are tested are the files that ship:
#   1. logic smoke tests;
#   2. publish the x64 full and slim single-file builds and launch-test both;
#   3. on pushes to main only: publish the Arm64 builds, zip all four with checksums, and keep
#      them as the "release-files" artifact. Tagging that commit vX.Y.Z publishes exactly those
#      files; the release workflow doesn't rebuild anything.
#
# Make "Build and smoke test" a required status check so a PR can't merge until it passes
# (see docs/TECHNICAL.md).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and smoke test
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Package release files only for pushes to main.
      PACKAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Logic smoke tests
        run: dotnet run -c Release --project tests/InputSwitch.SmokeTests -p:ContinuousIntegrationBuild=true

      - name: Publish
        shell: pwsh
        run: |
          # Two single-file builds per architecture:
          #   full - .NET runtime built in, nothing else to install (large)
          #   slim - uses the installed .NET 10 Desktop Runtime (small)
          # Arm64 is only needed for release files, so it's skipped on pull requests.
          $rids = if ($env:PACKAGE -eq 'true') { 'win-x64', 'win-arm64' } else { 'win-x64' }
          $common = @('-c', 'Release', '-p:DebugType=none', '-p:ContinuousIntegrationBuild=true', '-p:PublishSingleFile=true')
          foreach ($rid in $rids) {
            foreach ($flavour in 'full', 'slim') {
              $runtime = if ($flavour -eq 'full') {
                @('--self-contained', '-p:IncludeNativeLibrariesForSelfExtract=true')
              } else {
                @('--self-contained', 'false')
              }
              dotnet publish InputSwitch.csproj @common -r $rid @runtime -o "out/$rid-$flavour"
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
            }
          }

      - name: Launch smoke test (x64 full)
        shell: pwsh
        run: ./tests/launch-smoke.ps1 -Exe out/win-x64-full/InputSwitch.exe

      - name: Launch smoke test (x64 slim)
        shell: pwsh
        run: ./tests/launch-smoke.ps1 -Exe out/win-x64-slim/InputSwitch.exe

      - name: Zip release files
        if: env.PACKAGE == 'true'
        shell: pwsh
        run: |
          $version = (Select-Xml -Path InputSwitch.csproj -XPath '//VersionPrefix').Node.InnerText.Trim()
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($dir in Get-ChildItem out -Directory) {
            Compress-Archive -Path "$($dir.FullName)/*" -DestinationPath "dist/InputSwitch-$version-$($dir.Name).zip"
          }
          Get-ChildItem dist/*.zip | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content dist/SHA256SUMS.txt
          Get-ChildItem dist | Format-Table Name, Length

      - name: Keep the release files
        if: env.PACKAGE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: dist
          if-no-files-found: error
          retention-days: 90
