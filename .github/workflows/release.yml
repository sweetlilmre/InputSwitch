# Cuts a GitHub release when a version tag is pushed.
#
#   1. Bump <VersionPrefix> in InputSwitch.csproj and merge that to main.
#   2. Tag the merge commit:  git tag v1.2.0 && git push origin v1.2.0
#      (a tag with a suffix, e.g. v1.2.0-beta.1, makes a pre-release)
#
# The tag must match VersionPrefix. The smoke tests run first, then the release build itself is
# smoke-tested, and only then is the release created.

name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish release
    needs: smoke
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write   # create the release and upload its files

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check the tag matches the project version
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v(?<prefix>\d+\.\d+\.\d+)(?:-(?<suffix>[0-9A-Za-z][0-9A-Za-z.-]*))?$') {
            Write-Output "::error::Tag '$env:TAG' isn't vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-suffix."
            exit 1
          }
          $prefix = $Matches.prefix
          $suffix = $Matches.suffix
          $project = (Select-Xml -Path InputSwitch.csproj -XPath '//VersionPrefix').Node.InnerText.Trim()
          if ($project -ne $prefix) {
            Write-Output "::error::Tag $env:TAG doesn't match <VersionPrefix>$project</VersionPrefix> in InputSwitch.csproj. Bump VersionPrefix (or fix the tag) and tag again."
            exit 1
          }
          $version = if ($suffix) { "$prefix-$suffix" } else { $prefix }
          "version=$version"                          >> $env:GITHUB_OUTPUT
          "suffix=$suffix"                            >> $env:GITHUB_OUTPUT
          # Only a suffixed tag (v1.2.0-beta.1) is published as a pre-release.
          "prerelease=$(([bool]$suffix).ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Output "Releasing InputSwitch $version"

      - name: Build release files
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SUFFIX: ${{ steps.version.outputs.suffix }}
        run: |
          $common = @('-c', 'Release', '-p:DebugType=none', '-p:ContinuousIntegrationBuild=true')
          if ($env:SUFFIX) { $common += "-p:VersionSuffix=$env:SUFFIX" }
          New-Item -ItemType Directory -Force dist | Out-Null

          # Two single-file builds per architecture:
          #   full - .NET runtime built in, nothing else to install (large)
          #   slim - uses the installed .NET 10 Desktop Runtime (small)
          foreach ($rid in 'win-x64', 'win-arm64') {
            foreach ($flavour in 'full', 'slim') {
              $runtime = if ($flavour -eq 'full') {
                @('--self-contained', '-p:IncludeNativeLibrariesForSelfExtract=true')
              } else {
                @('--self-contained', 'false')
              }
              dotnet publish InputSwitch.csproj @common -r $rid @runtime -p:PublishSingleFile=true -o "out/$rid-$flavour"
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
              Compress-Archive -Path "out/$rid-$flavour/*" -DestinationPath "dist/InputSwitch-$env:VERSION-$rid-$flavour.zip"
            }
          }

          Get-ChildItem dist/*.zip | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content dist/SHA256SUMS.txt
          Get-ChildItem dist | Format-Table Name, Length

      - name: Smoke-test the full x64 build
        shell: pwsh
        run: ./tests/launch-smoke.ps1 -Exe out/win-x64-full/InputSwitch.exe

      - name: Smoke-test the slim x64 build
        shell: pwsh
        run: ./tests/launch-smoke.ps1 -Exe out/win-x64-slim/InputSwitch.exe

      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          $files = (Get-ChildItem dist/*).FullName
          $options = @('--title', "InputSwitch $env:VERSION", '--generate-notes', '--verify-tag')
          if ($env:PRERELEASE -eq 'true') { $options += '--prerelease' }
          gh release create $env:TAG @files @options
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
